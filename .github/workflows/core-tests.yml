name: Core Research Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11 Core Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create Conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: surgical-navigation
          environment-file: environment.yml
          channel-priority: strict

      - name: Show environment
        run: |
          python --version
          conda info
          conda list

      - name: Run core research test suite
        run: python -m pytest -q
